<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>

    <radialGradient id="inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#deeeff"/>
      <stop offset="100%" stop-color="white"/>
    </radialGradient>

    <radialGradient id="ring-glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="#002147" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a7bd5"  stop-opacity="0.18"/>
    </radialGradient>

    <filter id="node-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="outer-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Subtle outer ambient glow behind ring -->
  <circle cx="150" cy="150" r="135" fill="url(#ring-glow)"/>

  <!-- ── 8-pointed compass star ── -->
  <!-- 16-point polygon: cardinal tips r=148, diagonal tips r=128, inner valleys r=85 -->
  <polygon
    points="150,2  183,72  241,60  229,118
            298,150  229,183  241,241  183,229
            150,298  118,229  60,241  72,183
            2,150  72,118  60,60  118,72"
    fill="#002147"/>

  <!-- Outer ring -->
  <circle cx="150" cy="150" r="125" fill="none" stroke="#002147" stroke-width="12"/>

  <!-- ── Circuit traces along cardinal spokes ── -->
  <!-- North -->
  <line x1="150" y1="44" x2="150" y2="107" stroke="#5a9fd4" stroke-width="1.5" stroke-dasharray="5 3.5" opacity="0.85"/>
  <!-- South -->
  <line x1="150" y1="193" x2="150" y2="256" stroke="#5a9fd4" stroke-width="1.5" stroke-dasharray="5 3.5" opacity="0.85"/>
  <!-- East -->
  <line x1="193" y1="150" x2="256" y2="150" stroke="#5a9fd4" stroke-width="1.5" stroke-dasharray="5 3.5" opacity="0.85"/>
  <!-- West -->
  <line x1="44"  y1="150" x2="107" y2="150" stroke="#5a9fd4" stroke-width="1.5" stroke-dasharray="5 3.5" opacity="0.85"/>

  <!-- Square solder pads at mid-cardinal (~r=90) -->
  <rect x="146" y="56"  width="8" height="8" rx="1.5" fill="#87ceeb"/>
  <rect x="146" y="236" width="8" height="8" rx="1.5" fill="#87ceeb"/>
  <rect x="236" y="146" width="8" height="8" rx="1.5" fill="#87ceeb"/>
  <rect x="56"  y="146" width="8" height="8" rx="1.5" fill="#87ceeb"/>

  <!-- Round nodes at mid-diagonal (~r=90) -->
  <circle cx="214" cy="86"  r="4.5" fill="#87ceeb"/>
  <circle cx="214" cy="214" r="4.5" fill="#87ceeb"/>
  <circle cx="86"  cy="214" r="4.5" fill="#87ceeb"/>
  <circle cx="86"  cy="86"  r="4.5" fill="#87ceeb"/>

  <!-- Small tick marks on ring at all 8 spoke directions -->
  <!-- Cardinals -->
  <line x1="150" y1="120" x2="150" y2="112" stroke="#87ceeb" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="180" x2="150" y2="188" stroke="#87ceeb" stroke-width="2" opacity="0.6"/>
  <line x1="180" y1="150" x2="188" y2="150" stroke="#87ceeb" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="150" x2="112" y2="150" stroke="#87ceeb" stroke-width="2" opacity="0.6"/>
  <!-- Diagonals -->
  <line x1="171" y1="129" x2="176" y2="124" stroke="#87ceeb" stroke-width="1.5" opacity="0.5"/>
  <line x1="171" y1="171" x2="176" y2="176" stroke="#87ceeb" stroke-width="1.5" opacity="0.5"/>
  <line x1="129" y1="171" x2="124" y2="176" stroke="#87ceeb" stroke-width="1.5" opacity="0.5"/>
  <line x1="129" y1="129" x2="124" y2="124" stroke="#87ceeb" stroke-width="1.5" opacity="0.5"/>

  <!-- ── Inner white area (replaces original sun-ray circle) ── -->
  <circle cx="150" cy="150" r="42" fill="url(#inner-glow)"/>

  <!-- ── Neural network ── -->
  <!-- Hexagonal outer ring connections -->
  <line x1="150" y1="124" x2="173" y2="137" stroke="#5a9fd4" stroke-width="1.4"/>
  <line x1="173" y1="137" x2="173" y2="163" stroke="#5a9fd4" stroke-width="1.4"/>
  <line x1="173" y1="163" x2="150" y2="176" stroke="#5a9fd4" stroke-width="1.4"/>
  <line x1="150" y1="176" x2="127" y2="163" stroke="#5a9fd4" stroke-width="1.4"/>
  <line x1="127" y1="163" x2="127" y2="137" stroke="#5a9fd4" stroke-width="1.4"/>
  <line x1="127" y1="137" x2="150" y2="124" stroke="#5a9fd4" stroke-width="1.4"/>

  <!-- Center-to-node connections -->
  <line x1="150" y1="150" x2="150" y2="124" stroke="#5a9fd4" stroke-width="1.3" opacity="0.6"/>
  <line x1="150" y1="150" x2="173" y2="137" stroke="#5a9fd4" stroke-width="1.3" opacity="0.6"/>
  <line x1="150" y1="150" x2="173" y2="163" stroke="#5a9fd4" stroke-width="1.3" opacity="0.6"/>
  <line x1="150" y1="150" x2="150" y2="176" stroke="#5a9fd4" stroke-width="1.3" opacity="0.6"/>
  <line x1="150" y1="150" x2="127" y2="163" stroke="#5a9fd4" stroke-width="1.3" opacity="0.6"/>
  <line x1="150" y1="150" x2="127" y2="137" stroke="#5a9fd4" stroke-width="1.3" opacity="0.6"/>

  <!-- Outer hex nodes -->
  <circle cx="150" cy="124" r="3.5" fill="white" stroke="#5a9fd4" stroke-width="1.8"/>
  <circle cx="173" cy="137" r="3.5" fill="white" stroke="#5a9fd4" stroke-width="1.8"/>
  <circle cx="173" cy="163" r="3.5" fill="white" stroke="#5a9fd4" stroke-width="1.8"/>
  <circle cx="150" cy="176" r="3.5" fill="white" stroke="#5a9fd4" stroke-width="1.8"/>
  <circle cx="127" cy="163" r="3.5" fill="white" stroke="#5a9fd4" stroke-width="1.8"/>
  <circle cx="127" cy="137" r="3.5" fill="white" stroke="#5a9fd4" stroke-width="1.8"/>

  <!-- Centre node (glowing) -->
  <circle cx="150" cy="150" r="6"   fill="white" stroke="#5a9fd4" stroke-width="2" filter="url(#node-glow)"/>
  <circle cx="150" cy="150" r="2.8" fill="#5a9fd4"/>

  <!-- Inner ring border -->
  <circle cx="150" cy="150" r="42" fill="none" stroke="#002147" stroke-width="2.5"/>

</svg>
